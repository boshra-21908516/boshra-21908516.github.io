<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Loja</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="cesto.html">Cesto</a></li>
          <li><a href="amigos.html">Amigos</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Selecione os seus Produtos</h2>
        <aside class="filtros">
          <label>
            Filtrar
            <select id="filtro-categoria">
              <option value="">Todas as categorias</option>
            </select>
          </label>

          <label>
            Ordenar
            <select id="ordenar-preco">
              <option value="">Ordenar pelo preço</option>
              <option value="desc">Preço Decrescente</option>
              <option value="asc">Preço Crescente</option>
            </select>
          </label>

          <label>
            Procurar
            <input
              type="text"
              id="procurar-produto"
              placeholder="pesquise por produto"
            />
          </label>
        </aside>
        <div></div>
      </section>

      <section id="cesto">
        <h2>Produtos Selecionados</h2>
        <div id="produtos-selecionados"></div>
        <div id="checkout">
          <p id="preco-total"></p>
          <label>
            És estudante do DEISI?
            <input type="checkbox" id="estudante-deisi" />
          </label>
          <label>
            Cupão de desconto:
            <input type="text" id="cupao-desconto" />
          </label>
          <button id="botao-comprar" type="button">Comprar</button>
          <p id="valor-final"></p>
          <p id="referencia-pagamento"></p>
        </div>
      </section>
    </main>

    <footer>© 2026 Boshra</footer>
    <script src="script/script.js"></script>
  </body>
</html>
